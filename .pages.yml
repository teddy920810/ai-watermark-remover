media:
  - name: images
    label: 静态图片 / Static images
    input: public/uploads
    output: /uploads
    categories: [image]
    extensions: [jpg, jpeg, png, webp, gif, svg]
    rename: safe

settings:
  content:
    merge: true
  commit:
    identity: app
    templates:
      create: "content(create): {path}"
      update: "content(update): {path}"
      delete: "content(delete): {path}"
      rename: "content(rename): {oldPath} -> {newPath}"

actions:
  - name: validate-cms-content
    label: 检查站点内容 / Validate content
    workflow: cms-content-check.yml
    ref: current
    cancelable: false
    confirm:
      title: 检查当前已保存的内容？
      message: 系统会检查字段结构和站点内容；不会修改或发布额外内容。
      button: 开始检查

components:
  uploader-copy-override:
    type: object
    label: 上传组件独立文案（可选）
    description: 只填写需要自定义的字段；留空时逐项继承“站点设置”中的公共上传组件文案。
    fields:
      - name: hero
        label: 顶部文案
        type: object
        fields:
          - { name: eyebrow, label: 小标题｜SPAN, type: string }
          - { name: heading, label: 上传组件标题｜H2, type: string }
          - { name: demoBadge, label: 演示标记｜SPAN, type: string }
          - { name: demoBadgeTitle, label: 演示标记提示｜TITLE, type: string }
      - name: dropzone
        label: 拖拽上传区域
        type: object
        fields:
          - { name: dropLabel, label: 主提示｜STRONG, type: string }
          - { name: browseLabel, label: 浏览提示｜SPAN, type: string }
          - { name: formatLabel, label: 支持格式｜SMALL, type: string }
          - name: maxSizeLabel
            label: 文件大小提示｜SMALL
            type: string
            description: 使用 {maxSize} 代表系统允许的最大 MB 数；留空继承公共文案。
          - { name: fileInputLabel, label: 文件选择无障碍名称｜ARIA, type: string }
      - name: preview
        label: 已选图片与处理过程
        type: object
        fields:
          - name: altTemplate
            label: 预览图替代文字｜IMG ALT
            type: string
            description: 使用 {fileName} 代表已选择的文件名；留空继承公共文案。
          - { name: processingLabel, label: 处理中说明｜SPAN, type: string }
          - { name: readyLabel, label: 就绪说明｜SPAN, type: string }
          - { name: removeButton, label: 开始处理按钮｜BUTTON, type: string }
          - { name: uploadingButton, label: 上传中按钮｜BUTTON, type: string }
          - { name: processingButton, label: 处理中按钮｜BUTTON, type: string }
          - { name: chooseAnotherButton, label: 更换图片按钮｜BUTTON, type: string }
      - name: result
        label: 结果区域
        type: object
        fields:
          - { name: originalLabel, label: 原图标签｜FIGCAPTION, type: string }
          - { name: resultLabel, label: 结果标签｜FIGCAPTION, type: string }
          - { name: originalAlt, label: 原图替代文字｜IMG ALT, type: string }
          - { name: resultAlt, label: 结果图替代文字｜IMG ALT, type: string }
          - { name: demoNote, label: 演示说明｜P, type: text }
          - { name: downloadButton, label: 下载按钮｜A, type: string }
          - { name: processAnotherButton, label: 再次处理按钮｜BUTTON, type: string }
      - name: auth
        label: Google 登录提示
        type: object
        fields:
          - { name: closeLabel, label: 关闭按钮无障碍名称｜ARIA, type: string }
          - { name: title, label: 登录标题｜H3, type: string }
          - { name: description, label: 登录说明｜P, type: text }
          - { name: connectingButton, label: 连接中按钮｜BUTTON, type: string }
          - { name: continueButton, label: Google 登录按钮｜BUTTON, type: string }
          - { name: dismissButton, label: 暂不登录按钮｜BUTTON, type: string }
      - { name: privacyNote, label: 隐私说明｜P, type: text }

content:
  - name: site-settings
    label: 站点设置 / Site settings
    type: file
    path: src/content/settings/site.json
    format: json
    fields:
      - name: name
        label: 站点名称
        type: string
        required: true
      - name: analytics
        label: 数据分析 / Analytics
        type: object
        fields:
          - name: googleMeasurementId
            label: Google Analytics GA4 ID
            type: string
            description: 填写 G- 开头的 Measurement ID；留空会完全停用 GA 脚本。
      - name: canonicalOrigin
        label: SEO 规范域名 / Canonical origin
        type: string
        required: true
        description: 全站 canonical、robots 和 sitemap 使用的唯一 HTTPS 域名，例如 https://www.example.com；不要填写末尾斜杠或页面路径。
      - name: locale
        label: 页面语言代码｜HTML LANG
        type: string
        required: true
        description: 例如英文填写 en，简体中文填写 zh-CN。
      - name: themeColor
        label: 品牌强调色 / Theme color
        type: string
        required: true
        description: 控制按钮、链接、上传图标和导航交互的品牌强调色，同时用于浏览器主题色；系统会自动加深颜色以保证文字可读性。填写六位十六进制颜色，例如 #a06dff。
      - name: themeColorFallback
        label: 品牌强调色兜底 / Theme fallback
        type: string
        required: true
        description: 当主题色未能加载时使用的备用品牌色；填写六位十六进制颜色，例如 #1d6b56。
      - name: logo
        label: 品牌 Logo｜IMG
        type: image
        required: true
        description: 显示在 Header、Footer 和登录提示中的品牌图片，建议使用正方形 SVG 或 PNG。
        options:
          media: images
      - name: defaultTitle
        label: 默认 SEO 标题｜TITLE
        type: string
        required: true
        description: 浏览器标签和搜索结果标题的默认值，不是页面中的 H1。
      - name: defaultDescription
        label: 默认 SEO 描述｜META
        type: text
        required: true
        description: 搜索引擎使用的页面摘要，页面正文中通常不直接显示。
        options:
          maxlength: 180
      - name: favicon
        label: 浏览器图标 / Favicon
        type: image
        required: true
        options:
          media: images
      - name: defaultShareImage
        label: 默认分享图片
        type: image
        required: true
        options:
          media: images
      - name: structuredData
        label: 应用结构化数据 / Schema.org
        type: object
        fields:
          - name: applicationCategory
            label: 应用分类
            type: string
            required: true
          - name: operatingSystem
            label: 支持的操作系统
            type: string
            required: true
          - name: price
            label: 默认价格
            type: string
            required: true
          - name: priceCurrency
            label: 货币代码
            type: string
            required: true
            description: 三位大写代码，例如 USD、CNY。
      - name: contentDefaults
        label: 博客默认信息
        type: object
        fields:
          - name: author
            label: 默认作者
            type: string
            required: true
            description: 文章没有单独填写作者时使用。
          - name: category
            label: 默认分类
            type: string
            required: true
            description: 文章没有单独填写分类时使用。
      - name: announcement
        label: 公告 / Announcement
        type: object
        fields:
          - name: enabled
            label: 显示公告
            type: boolean
            default: false
          - name: text
            label: 公告内容｜SPAN
            type: text
            required: true
            description: 顶部公告栏中的短文字，不属于 H1–H3 标题层级。
          - name: linkLabel
            label: 链接文字｜A（可选）
            type: string
            description: 用户看到并可点击的链接文字。
          - name: linkHref
            label: 链接地址｜HREF（可选）
            type: string
            description: 链接目标；站内链接建议使用 /blog 这样的路径。
      - name: uploader
        label: 上传组件 / Image uploader
        type: object
        description: 全站公共默认文案；首页或工具页没有单独填写的字段会读取这里。
        fields:
          - name: hero
            label: 顶部文案
            type: object
            fields:
              - { name: eyebrow, label: 小标题｜SPAN, type: string, required: true }
              - { name: heading, label: 上传组件标题｜H2, type: string, required: true }
              - { name: demoBadge, label: 演示标记｜SPAN, type: string, required: true }
              - { name: demoBadgeTitle, label: 演示标记提示｜TITLE, type: string, required: true }
          - name: dropzone
            label: 拖拽上传区域
            type: object
            fields:
              - { name: dropLabel, label: 主提示｜STRONG, type: string, required: true }
              - { name: browseLabel, label: 浏览提示｜SPAN, type: string, required: true }
              - { name: formatLabel, label: 支持格式｜SMALL, type: string, required: true }
              - name: maxSizeLabel
                label: 文件大小提示｜SMALL
                type: string
                required: true
                description: 使用 {maxSize} 代表系统允许的最大 MB 数，例如 up to {maxSize} MB。
              - { name: fileInputLabel, label: 文件选择无障碍名称｜ARIA, type: string, required: true }
          - name: preview
            label: 已选图片与处理过程
            type: object
            fields:
              - name: altTemplate
                label: 预览图替代文字｜IMG ALT
                type: string
                required: true
                description: 使用 {fileName} 代表已选择的文件名。
              - { name: processingLabel, label: 处理中说明｜SPAN, type: string, required: true }
              - { name: readyLabel, label: 就绪说明｜SPAN, type: string, required: true }
              - { name: removeButton, label: 开始处理按钮｜BUTTON, type: string, required: true }
              - { name: uploadingButton, label: 上传中按钮｜BUTTON, type: string, required: true }
              - { name: processingButton, label: 处理中按钮｜BUTTON, type: string, required: true }
              - { name: chooseAnotherButton, label: 更换图片按钮｜BUTTON, type: string, required: true }
          - name: result
            label: 结果区域
            type: object
            fields:
              - { name: originalLabel, label: 原图标签｜FIGCAPTION, type: string, required: true }
              - { name: resultLabel, label: 结果标签｜FIGCAPTION, type: string, required: true }
              - { name: originalAlt, label: 原图替代文字｜IMG ALT, type: string, required: true }
              - { name: resultAlt, label: 结果图替代文字｜IMG ALT, type: string, required: true }
              - { name: demoNote, label: 演示说明｜P, type: text, required: true }
              - { name: downloadButton, label: 下载按钮｜A, type: string, required: true }
              - { name: processAnotherButton, label: 再次处理按钮｜BUTTON, type: string, required: true }
          - name: auth
            label: Google 登录提示
            type: object
            fields:
              - { name: closeLabel, label: 关闭按钮无障碍名称｜ARIA, type: string, required: true }
              - { name: title, label: 登录标题｜H3, type: string, required: true }
              - { name: description, label: 登录说明｜P, type: text, required: true }
              - { name: connectingButton, label: 连接中按钮｜BUTTON, type: string, required: true }
              - { name: continueButton, label: Google 登录按钮｜BUTTON, type: string, required: true }
              - { name: dismissButton, label: 暂不登录按钮｜BUTTON, type: string, required: true }
          - { name: privacyNote, label: 隐私说明｜P, type: text, required: true }
      - name: processVisuals
        label: 公共使用步骤配图 / Process visuals
        type: object
        list:
          min: 3
          max: 3
          collapsible:
            collapsed: true
            summary: "{imageAlt}"
        description: 首页和工具页未单独选择配图时，按顺序读取这里的三张公共默认图。
        fields:
          - name: image
            label: 步骤配图｜IMG
            type: image
            required: true
            options:
              media: images
          - name: imageAlt
            label: 图片替代文字｜IMG ALT
            type: string
            required: true
      - name: cta
        label: 公共行动模块 / CTA
        type: object
        description: 显示在所有公开页面 Footer 上方。
        fields:
          - { name: eyebrow, label: 模块小标题｜SPAN, type: string, required: true }
          - { name: heading, label: 行动标题｜H2, type: string, required: true }
          - { name: description, label: 行动说明｜P, type: text, required: true }
          - { name: buttonLabel, label: 按钮文字｜A, type: string, required: true }
          - { name: buttonHref, label: 按钮链接｜HREF, type: string, required: true }
      - name: header
        label: 页头 / Header
        type: object
        fields:
          - name: navigation
            label: 导航链接
            type: object
            list:
              min: 1
              collapsible:
                collapsed: true
                summary: "{label}"
            fields:
              - name: label
                label: 导航文字｜A
                type: string
                required: true
                description: Header 中用户可点击的导航文字。
              - name: href
                label: 普通链接地址｜HREF（下拉菜单可留空）
                type: string
                description: 没有下拉项时必须填写；站内链接使用以 / 开头的路径。
              - name: children
                label: 一级下拉链接
                type: object
                description: 添加一项后，该导航会显示为下拉菜单；只支持一级，不再嵌套分类。
                list:
                  collapsible:
                    collapsed: true
                    summary: "{label}"
                fields:
                  - name: label
                    label: 下拉链接文字｜A
                    type: string
                    required: true
                    description: 下拉菜单中用户可点击的文字。
                  - name: href
                    label: 下拉链接地址｜HREF
                    type: string
                    required: true
                    description: 链接目标；站内链接使用以 / 开头的路径。
      - name: footer
        label: 页脚 / Footer
        type: object
        fields:
          - name: tagline
            label: 品牌说明｜P
            type: text
            required: true
            description: Footer 品牌名称下方的普通说明段落。
          - name: groups
            label: 页脚链接分组
            type: object
            list:
              min: 1
              collapsible:
                collapsed: true
                summary: "{heading}"
            fields:
              - name: heading
                label: 分组标题｜H2
                type: string
                required: true
              - name: links
                label: 分组链接
                type: object
                list:
                  min: 1
                  collapsible:
                    collapsed: true
                    summary: "{label}"
                fields:
                  - name: label
                    label: 链接文字｜A
                    type: string
                    required: true
                  - name: href
                    label: 链接地址｜HREF
                    type: string
                    required: true
                    description: 链接目标；站内链接使用以 / 开头的路径。

  - name: sitemap-settings
    label: Sitemap 设置 / Sitemap settings
    type: file
    path: src/content/settings/sitemap.json
    format: json
    fields:
      - name: lastmod
        label: 公共页面最后更新时间 / LASTMOD
        type: date
        required: true
        description: 首页、博客列表、法律页和工具落地页共用的最近一次实质内容更新时间；博客文章使用自己的发布日期。
        options:
          format: yyyy-MM-dd
      - name: groups
        label: 页面类型默认规则
        type: object
        fields:
          - name: homepage
            label: 首页
            type: object
            fields:
              - name: changefreq
                label: 更新频率 / CHANGEFREQ
                type: select
                required: true
                options:
                  values: [always, hourly, daily, weekly, monthly, yearly, never]
              - name: priority
                label: 相对优先级 / PRIORITY
                type: number
                required: true
                options: { min: 0, max: 1, step: 0.1 }
          - name: landingPages
            label: 工具落地页
            type: object
            fields:
              - name: changefreq
                label: 更新频率 / CHANGEFREQ
                type: select
                required: true
                options:
                  values: [always, hourly, daily, weekly, monthly, yearly, never]
              - name: priority
                label: 相对优先级 / PRIORITY
                type: number
                required: true
                options: { min: 0, max: 1, step: 0.1 }
          - name: blogIndex
            label: 博客列表页
            type: object
            fields:
              - name: changefreq
                label: 更新频率 / CHANGEFREQ
                type: select
                required: true
                options:
                  values: [always, hourly, daily, weekly, monthly, yearly, never]
              - name: priority
                label: 相对优先级 / PRIORITY
                type: number
                required: true
                options: { min: 0, max: 1, step: 0.1 }
          - name: blogPosts
            label: 博客文章
            type: object
            fields:
              - name: changefreq
                label: 更新频率 / CHANGEFREQ
                type: select
                required: true
                options:
                  values: [always, hourly, daily, weekly, monthly, yearly, never]
              - name: priority
                label: 相对优先级 / PRIORITY
                type: number
                required: true
                options: { min: 0, max: 1, step: 0.1 }
          - name: legalPages
            label: 法律页面
            type: object
            fields:
              - name: changefreq
                label: 更新频率 / CHANGEFREQ
                type: select
                required: true
                options:
                  values: [always, hourly, daily, weekly, monthly, yearly, never]
              - name: priority
                label: 相对优先级 / PRIORITY
                type: number
                required: true
                options: { min: 0, max: 1, step: 0.1 }
      - name: overrides
        label: 单个页面覆盖规则
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{path}"
        description: 只覆盖自动发现的真实页面；在这里填写不存在的路径不会把 404 地址加入 sitemap。
        fields:
          - name: path
            label: 页面路径
            type: string
            required: true
            description: 必须以 / 开头且不使用末尾斜杠，例如 /remove-gemini-watermark。
          - name: lastmod
            label: 单独最后更新时间（可选）
            type: date
            options:
              format: yyyy-MM-dd
          - name: changefreq
            label: 单独更新频率（可选）
            type: select
            options:
              values: [always, hourly, daily, weekly, monthly, yearly, never]
          - name: priority
            label: 单独优先级（可选）
            type: number
            options: { min: 0, max: 1, step: 0.1 }

  - name: image-metadata
    label: 图片信息 / Image metadata
    type: file
    path: src/content/settings/images.json
    format: json
    fields:
      - name: images
        label: 可复用图片说明
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{src}"
        description: 为会在多个页面复用的图片集中维护 Alt、标题和尺寸；具体文章仍可填写自己的 Alt 覆盖这里的值。
        fields:
          - name: src
            label: 图片｜IMG SRC
            type: image
            required: true
            options:
              media: images
          - name: alt
            label: 默认替代文字｜IMG ALT
            type: string
            required: true
            description: 描述图片传达的信息，不要写“图片”或堆砌关键词。
          - name: title
            label: 内部识别名称（可选）
            type: string
            description: 供运营人员识别资源，不一定显示在页面上。
          - name: width
            label: 原始宽度 px（可选）
            type: number
            options:
              min: 1
          - name: height
            label: 原始高度 px（可选）
            type: number
            options:
              min: 1

  - name: blog-index
    label: 博客列表设置 / Blog index
    type: file
    path: src/content/settings/blog.json
    format: json
    fields:
      - name: title
        label: SEO 标题｜TITLE
        type: string
        required: true
        description: 浏览器和搜索结果标题，不是页面可见的 H1。
      - name: description
        label: SEO 描述｜META
        type: text
        required: true
        description: 搜索结果摘要，页面正文中不直接显示。
        options:
          maxlength: 180
      - name: shareImage
        label: 分享图片
        type: image
        required: true
        options:
          media: images
      - name: eyebrow
        label: 博客小标题｜SPAN
        type: string
        required: true
        description: 显示在页面主标题上方的装饰性短文字，不属于标题层级。
      - name: heading
        label: 博客页面主标题｜H1
        type: string
        required: true
        description: 博客列表页唯一的 H1，建议清楚说明本页主题。
      - name: intro
        label: 博客页面简介｜P
        type: text
        required: true
        description: H1 下方的一段简短说明文字。
      - name: postsPerPage
        label: 最多显示文章数
        type: number
        required: true
        default: 20
        options:
          min: 1
          max: 100

  - name: not-found
    label: 404 页面 / Not found
    type: file
    path: src/content/settings/not-found.json
    format: json
    fields:
      - name: title
        label: SEO 标题｜TITLE
        type: string
        required: true
        description: 404 页浏览器标签标题，不是页面可见的 H1。
      - name: description
        label: SEO 描述｜META
        type: text
        required: true
