media:
  - name: images
    label: 静态图片 / Static images
    input: public/uploads
    output: /uploads
    categories: [image]
    extensions: [jpg, jpeg, png, webp, gif, svg]
    rename: safe

settings:
  content:
    merge: true
  commit:
    identity: app
    templates:
      create: "content(create): {path}"
      update: "content(update): {path}"
      delete: "content(delete): {path}"
      rename: "content(rename): {oldPath} -> {newPath}"

content:
  - name: site-settings
    label: 站点设置 / Site settings
    type: file
    path: src/content/settings/site.json
    format: json
    fields:
      - name: name
        label: 站点名称
        type: string
        required: true
      - name: brandMark
        label: 品牌标记
        type: string
        required: true
      - name: defaultTitle
        label: 默认 SEO 标题
        type: string
        required: true
      - name: defaultDescription
        label: 默认 SEO 描述
        type: text
        required: true
        options:
          maxlength: 180
      - name: favicon
        label: 浏览器图标 / Favicon
        type: image
        required: true
        options:
          media: images
      - name: defaultShareImage
        label: 默认分享图片
        type: image
        required: true
        options:
          media: images
      - name: announcement
        label: 公告 / Announcement
        type: object
        fields:
          - name: enabled
            label: 显示公告
            type: boolean
            default: false
          - name: text
            label: 公告内容
            type: text
            required: true
          - name: linkLabel
            label: 链接文字（可选）
            type: string
          - name: linkHref
            label: 链接地址（可选）
            type: string
      - name: header
        label: 页头 / Header
        type: object
        fields:
          - name: navigation
            label: 导航链接
            type: object
            list:
              min: 1
              collapsible:
                collapsed: true
                summary: "{label}"
            fields:
              - name: label
                label: 链接文字
                type: string
                required: true
              - name: href
                label: 链接地址
                type: string
                required: true
      - name: footer
        label: 页脚 / Footer
        type: object
        fields:
          - name: tagline
            label: 品牌说明
            type: text
            required: true
          - name: links
            label: 页脚链接
            type: object
            list:
              min: 1
              collapsible:
                collapsed: true
                summary: "{label}"
            fields:
              - name: label
                label: 链接文字
                type: string
                required: true
              - name: href
                label: 链接地址
                type: string
                required: true

  - name: sitemap
    label: 站点地图 / Sitemap.xml
    type: file
    path: public/sitemap.xml
    format: code

  - name: blog-index
    label: 博客列表设置 / Blog index
    type: file
    path: src/content/settings/blog.json
    format: json
    fields:
      - name: title
        label: SEO 标题
        type: string
        required: true
      - name: description
        label: SEO 描述
        type: text
        required: true
        options:
          maxlength: 180
      - name: shareImage
        label: 分享图片
        type: image
        required: true
        options:
          media: images
      - name: eyebrow
        label: 小标题
        type: string
        required: true
      - name: heading
        label: 主标题
        type: string
        required: true
      - name: intro
        label: 简介
        type: text
        required: true
      - name: postsPerPage
        label: 最多显示文章数
        type: number
        required: true
        default: 20
        options:
          min: 1
          max: 100

  - name: landing-common
    label: 落地页公共模块 / Landing shared sections
    type: file
    path: src/content/settings/landing.json
    format: json
    fields:
      - name: process
        label: 使用步骤
        type: object
        fields:
          - name: eyebrow
            label: 小标题
            type: string
            required: true
          - name: heading
            label: 主标题
            type: string
            required: true
          - name: steps
            label: 步骤
            type: object
            list:
              min: 1
              collapsible:
                collapsed: true
                summary: "{number} {title}"
            fields:
              - name: number
                label: 序号
                type: string
                required: true
              - name: title
                label: 标题
                type: string
                required: true
              - name: description
                label: 说明
                type: text
                required: true
      - name: faq
        label: FAQ 标题
        type: object
        fields:
          - name: eyebrow
            label: 小标题
            type: string
            required: true
          - name: heading
            label: 主标题
            type: string
            required: true

  - name: not-found
    label: 404 页面 / Not found
    type: file
    path: src/content/settings/not-found.json
    format: json
    fields:
      - name: title
        label: SEO 标题
        type: string
        required: true
      - name: description
        label: SEO 描述
        type: text
        required: true
        options:
          maxlength: 180
      - name: eyebrow
        label: 小标题
        type: string
        required: true
      - name: heading
        label: 主标题
        type: string
        required: true
      - name: intro
        label: 说明
        type: text
        required: true
      - name: buttonLabel
        label: 按钮文字
        type: string
        required: true
      - name: buttonHref
        label: 按钮链接
        type: string
        required: true

  - name: legal-pages
    label: 法律页面 / Legal pages
    type: collection
    path: src/content/legal
    format: yaml-frontmatter
    filename: "{fields.slug}.md"
    operations:
      create: false
      rename: false
      delete: false
    view:
      fields: [title, slug]
      primary: title
      sort: [title]
    fields:
      - name: slug
        label: URL 路径
        type: string
        required: true
        readonly: true
      - name: title
        label: SEO 标题
        type: string
        required: true
      - name: description
        label: SEO 描述
        type: text
        required: true
        options:
          maxlength: 180
      - name: eyebrow
        label: 小标题
        type: string
        required: true
      - name: heading
        label: 主标题
        type: string
        required: true
      - name: body
        label: 正文
        type: rich-text
        required: true
        options:
          media: images

  - name: homepage
    label: 首页 / Homepage
    type: file
    path: src/content/homepage/home.json
    format: json
    fields:
      - name: title
        label: SEO 标题
        type: string
        required: true
      - name: description
        label: SEO 描述
        type: text
        required: true
        options:
          maxlength: 180
      - name: shareImage
        label: 分享图片 / Social image
        type: image
        required: true
        options:
          media: images
      - name: hero
        label: 首屏 / Hero
        type: object
        fields:
          - name: eyebrow
            label: 小标题
            type: string
            required: true
          - name: heading
            label: 主标题
            type: string
            required: true
          - name: highlightedHeading
            label: 强调标题
            type: string
            required: true
          - name: intro
            label: 简介
            type: text
            required: true
          - name: trustItems
            label: 信任标签
            type: string
            list:
              min: 1
      - name: useCases
        label: 常用工具入口
        type: object
        list:
          min: 1
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          - name: icon
            label: 图标字符
            type: string
            required: true
          - name: title
            label: 标题
            type: string
            required: true
          - name: description
            label: 说明
            type: string
            required: true
          - name: href
            label: 链接
            type: string
            required: true
      - name: process
        label: 使用步骤
        type: object
        fields:
          - name: eyebrow
            label: 小标题
            type: string
            required: true
          - name: heading
            label: 标题
            type: string
            required: true
          - name: intro
            label: 简介
            type: text
            required: true
          - name: steps
            label: 步骤
            type: object
            list:
              min: 1
              collapsible:
                collapsed: true
                summary: "{number} {title}"
            fields:
              - name: number
                label: 序号
                type: string
                required: true
              - name: title
                label: 标题
                type: string
                required: true
              - name: description
                label: 说明
                type: text
                required: true
      - name: privacy
        label: 隐私说明
        type: object
        fields:
          - name: eyebrow
            label: 小标题
            type: string
            required: true
          - name: heading
            label: 标题
            type: string
            required: true
          - name: description
            label: 说明
            type: text
            required: true
          - name: linkLabel
            label: 链接文字
            type: string
            required: true
          - name: linkHref
            label: 链接地址
            type: string
            required: true
          - name: features
            label: 隐私特点
            type: object
            list:
              min: 1
              collapsible:
                collapsed: true
                summary: "{title}"
            fields:
              - name: icon
                label: 图标字符
                type: string
                required: true
              - name: title
                label: 标题
                type: string
                required: true
              - name: description
                label: 说明
                type: string
                required: true
      - name: guides
        label: 指南区域
        type: object
        fields:
          - name: eyebrow
            label: 小标题
            type: string
            required: true
          - name: heading
            label: 标题
            type: string
            required: true
          - name: linkLabel
            label: 全部指南链接文字
            type: string
            required: true
          - name: linkHref
            label: 全部指南链接地址
            type: string
            required: true
          - name: articleLinkLabel
            label: 文章链接文字
            type: string
            required: true

  - name: blog
    label: 博客文章 / Blog posts
    type: collection
    path: src/content/blog
    format: yaml-frontmatter
    filename: "{fields.slug}.md"
    operations:
      create: true
      rename: false
      delete: true
    view:
      fields: [title, slug, category, publishedAt, draft]
      primary: title
      sort: [publishedAt, title]
      search: [title, description]
      default:
        sort: publishedAt
        order: desc
    fields:
      - name: slug
        label: URL 路径（发布后不要修改）
        type: string
        required: true
        pattern:
          regex: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
          message: 只能使用小写字母、数字和连字符，例如 image-format-guide。
      - name: title
        label: 标题 / Title
        type: string
        required: true
      - name: description
        label: SEO 描述（不超过 180 字符）
        type: text
        required: true
        options:
          maxlength: 180
      - name: publishedAt
        label: 发布日期 / Publish date
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: readTime
        label: 阅读时间 / Reading time
        type: string
        required: true
        default: 5 min read
      - name: coverImage
        label: 封面图 / Cover image
        type: image
        options:
          media: images
      - name: coverAlt
        label: 封面图替代文字 / Image alt
        type: string
        description: 上传封面图时请填写，用于无障碍和图片 SEO。
      - name: author
        label: 作者 / Author
        type: string
        default: ClearMark AI
      - name: category
        label: 分类 / Category
        type: string
        default: Guides
      - name: featured
        label: 置顶文章 / Featured
        type: boolean
        default: false
      - name: draft
        label: 草稿（不发布）/ Draft
        type: boolean
        default: false
      - name: body
        label: 正文 / Article body
        type: rich-text
        required: true
        options:
          media: images

  - name: landing-pages
    label: 工具落地页 / Tool landing pages
    type: collection
    path: src/content/landing-pages
    format: json
    filename: "{fields.slug}.json"
    operations:
      create: true
      rename: false
      delete: true
    view:
      fields: [title, slug]
      primary: title
      sort: [title]
      search: [title, slug, description]
    fields:
      - name: slug
        label: URL 路径（发布后不要修改）
        type: string
        required: true
        pattern:
          regex: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
          message: 只能使用小写字母、数字和连字符，例如 remove-logo-from-image。
      - name: title
        label: SEO 标题
        type: string
        required: true
      - name: description
        label: SEO 描述（不超过 180 字符）
        type: text
        required: true
        options:
          maxlength: 180
      - name: eyebrow
        label: 小标题 / Eyebrow
        type: string
        required: true
      - name: heading
        label: 主标题 / Main heading
        type: string
        required: true
      - name: intro
        label: 简介 / Introduction
        type: text
        required: true
      - name: benefits
        label: 优点列表 / Benefits
        type: string
        list:
          min: 1
      - name: faq
        label: 常见问题 / FAQ
        type: object
        list:
          min: 1
          collapsible:
            collapsed: true
            summary: "{question}"
        fields:
          - name: question
            label: 问题 / Question
            type: string
            required: true
          - name: answer
            label: 回答 / Answer
            type: text
            required: true
