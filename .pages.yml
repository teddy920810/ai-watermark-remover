      sort: [title]
      search: [title, slug, description]
    fields:
      - name: slug
        label: URL 路径（发布后不要修改）
        type: string
        required: true
        pattern:
          regex: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
          message: Lowercase letters, digits, and hyphens only.
      - name: title
        label: SEO 标题｜TITLE
        type: string
        required: true
        description: SEO title for the page.
      - name: description
        label: SEO 描述｜META（不超过 180 字符）
        type: text
        required: true
        description: Search snippet, not rendered in the page body.
        options:
          maxlength: 180
      - name: eyebrow
        label: 页面小标题｜SPAN
        type: string
        required: true
        description: Decorative short text above the H1.
      - name: heading
        label: 页面主标题｜H1
        type: string
        required: true
        description: The page H1.
      - name: intro
        label: 页面简介｜P
        type: text
        required: true
        description: Short paragraph under the H1.
      - name: benefits
        label: 优点列表｜LI
        type: string
        list:
          min: 1
        description: Each item renders as a list row.
      - name: faq
        label: 常见问题 / FAQ
        type: object
        list:
          min: 1
          collapsible:
            collapsed: true
            summary: '{question}'
        fields:
          - name: question
            label: FAQ 问题｜SUMMARY
            type: string
            required: true
            description: Question text for the FAQ row.
          - name: answer
            label: FAQ 回答｜P
            type: text
            required: true
            description: Short answer paragraph for the FAQ row.


