  - name: blog
    label: 博客文章 / Blog posts
    type: collection
    path: src/content/blog
    format: yaml-frontmatter
    filename: "{fields.slug}.md"
    operations:
      create: true
      rename: false
      delete: true
    view:
      fields: [title, slug, category, publishedAt, draft]
      primary: title
      sort: [publishedAt, title]
      search: [title, description]
      default:
        sort: publishedAt
        order: desc
    fields:
      - name: slug
        label: URL 路径（发布后不要修改）
        type: string
        required: true
        pattern:
          regex: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
          message: 只能使用小写字母、数字和连字符，例如 image-format-guide。
      - name: title
        label: 文章标题｜H1（详情页）/ H2（列表页）
        type: string
        required: true
        description: 文章详情页唯一的 H1；在博客列表页显示为 H2。
      - name: seoTitle
        label: 独立 SEO 标题｜TITLE（可选）
        type: string
        description: 单独控制文章详情页 head 中的 title 标签；留空时自动使用“文章标题 | 站点名称”，不会改变页面 H1 或博客列表 H2。
      - name: description
        label: 文章摘要｜META + 列表 P（不超过 180 字符）
        type: text
        required: true
        description: 用于搜索摘要和博客列表卡片中的普通段落，不在文章详情页标题下方显示。
        options:
          maxlength: 180
      - name: publishedAt
        label: 发布日期 / Publish date
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: updatedAt
        label: 最后更新日期 / Date modified（可选）
        type: date
        description: 文章有实质更新时填写；用于 Article Schema 的 dateModified 和 sitemap 的后续维护。
        options:
          format: yyyy-MM-dd
      - name: readTime
        label: 阅读时间｜SPAN
        type: string
        required: true
        default: 5 min read
        description: 文章元信息中的短文字，不属于标题层级。
      - name: coverImage
        label: 封面图 / Cover image
        type: image
        options:
          media: images
      - name: coverAlt
        label: 封面图替代文字｜IMG ALT
        type: string
        description: 上传封面图时请填写，用于无障碍和图片 SEO。
      - name: author
        label: 作者｜SPAN
        type: string
        description: 文章元信息中的作者名称；留空使用“站点设置”里的默认作者。
      - name: category
        label: 分类｜SPAN
        type: string
        description: 文章列表和详情页中的短分类标签；留空使用“站点设置”里的默认分类。
      - name: featured
        label: 置顶文章 / Featured
        type: boolean
        default: false
      - name: draft
        label: 草稿（不发布）/ Draft
        type: boolean
        default: false
      - name: contentMode
        label: 正文格式 / Content mode
        type: select
        required: true
        default: markdown
        description: 普通编辑选择 Markdown；只有需要精确 HTML 结构时才选择 HTML。
        options:
          values:
            - name: markdown
              label: Markdown（推荐）
            - name: html
              label: HTML（高级）
      - name: body
        label: Markdown 正文｜H2 / H3 / P
        type: rich-text
        description: 正文格式选择 Markdown 时填写。支持段落、H2、H3、无序列表、有序列表、Quote、Table、Code block 和图片；不要再添加 H1。选中文字后使用浮动工具栏添加链接。
        options:
          media: images
          format: markdown
          switcher: true
      - name: bodyHtml
        label: HTML 正文｜可信 HTML
        type: rich-text
        description: 正文格式选择 HTML 时填写；可在 Source 模式编辑 HTML。不要加入 script、iframe 或事件属性。
        options:
          media: images
          format: html
          switcher: true

