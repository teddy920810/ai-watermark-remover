  - name: blog
    label: 博客文章 / Blog posts
    type: collection
    path: src/content/blog
    format: yaml-frontmatter
    filename: "{fields.slug}.md"
    operations:
      create: true
      rename: false
      delete: true
    view:
      fields: [title, slug, category, publishedAt, draft]
      primary: title
      sort: [publishedAt, title]
      search: [title, description]
      default:
        sort: publishedAt
        order: desc
    fields:
      - name: slug
        label: URL 路径（发布后不要修改）
        type: string
        required: true
        pattern:
          regex: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
          message: 只能使用小写字母、数字和连字符，例如 image-format-guide。
      - name: title
        label: 文章标题｜H1（详情页）/ H2（列表页）
        type: string
        required: true
        description: 文章详情页唯一的 H1；在博客列表页显示为 H2。
      - name: description
        label: 文章摘要｜META + P（不超过 180 字符）
        type: text
        required: true
        description: 同时用于搜索摘要，以及文章标题下方和列表卡片中的普通段落。
        options:
          maxlength: 180
      - name: publishedAt
        label: 发布日期 / Publish date
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: updatedAt
        label: 最后更新日期 / Date modified（可选）
        type: date
        description: 文章有实质更新时填写；用于 Article Schema 的 dateModified 和 sitemap 的后续维护。
        options:
          format: yyyy-MM-dd
      - name: readTime
        label: 阅读时间｜SPAN
        type: string
        required: true
        default: 5 min read
        description: 文章元信息中的短文字，不属于标题层级。
      - name: coverImage
        label: 封面图 / Cover image
        type: image
        options:
          media: images
      - name: coverAlt
        label: 封面图替代文字｜IMG ALT
        type: string
        description: 上传封面图时请填写，用于无障碍和图片 SEO。
      - name: author
        label: 作者｜SPAN
        type: string
        description: 文章元信息中的作者名称；留空使用“站点设置”里的默认作者。
      - name: category
        label: 分类｜SPAN
        type: string
        description: 文章列表和详情页中的短分类标签；留空使用“站点设置”里的默认分类。
      - name: featured
        label: 置顶文章 / Featured
        type: boolean
        default: false
      - name: draft
        label: 草稿（不发布）/ Draft
        type: boolean
        default: false
      - name: contentMode
        label: 正文格式 / Content mode
        type: select
        required: true
        default: markdown
        description: 普通编辑选择 Markdown；只有需要精确 HTML 结构时才选择 HTML。
        options:
          values:
            - name: markdown
              label: Markdown（推荐）
            - name: html
              label: HTML（高级）
      - name: body
        label: Markdown 正文｜H2 / H3 / P
        type: rich-text
        description: 正文格式选择 Markdown 时填写。普通段落使用 P；主要章节使用 H2；不要再添加 H1。
        options:
          media: images
          format: markdown
          switcher: true
      - name: bodyHtml
        label: HTML 正文｜可信 HTML
        type: rich-text
        description: 正文格式选择 HTML 时填写；可在 Source 模式编辑 HTML。不要加入 script、iframe 或事件属性。
        options:
          media: images
          format: html
          switcher: true

  - name: landing-pages
    label: 工具落地页 / Tool landing pages
    type: collection
    path: src/content/landing-pages
    format: json
    filename: "{fields.slug}.json"
    operations:
      create: true
      rename: false
      delete: true
    view:
      fields: [title, slug]
      primary: title
      sort: [title]
      search: [title, slug, description]
    fields:
      - name: slug
        label: URL 路径（发布后不要修改）
        type: string
        required: true
        pattern:
          regex: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
          message: 只能使用小写字母、数字和连字符，例如 remove-logo-from-image。
      - name: title
        label: SEO 标题｜TITLE
        type: string
        required: true
        description: 浏览器和搜索结果标题，不是页面可见的 H1。
      - name: description
        label: SEO 描述｜META（不超过 180 字符）
        type: text
        required: true
        description: 搜索结果摘要，页面正文中不直接显示。
        options:
          maxlength: 180
      - name: eyebrow
        label: 页面小标题｜SPAN
        type: string
        required: true
        description: H1 上方的装饰性短文字，不属于标题层级。
      - name: heading
        label: 页面主标题｜H1
        type: string
        required: true
        description: 工具落地页唯一的 H1。
      - name: intro
        label: 页面简介｜P
        type: text
        required: true
        description: H1 下方的一段简短说明文字。
      - name: benefits
        label: 优点列表｜LI
        type: string
        list:
          min: 1
        description: 每一项会显示为列表条目，不属于标题层级。
      - name: features
        label: 功能亮点 / Features（可选）
        type: object
        description: 显示在“使用步骤”和 FAQ 之间；至少添加一项图文功能屏后才会在页面展示。
        fields:
          - name: eyebrow
            label: 模块小标题｜SPAN
            type: string
          - name: heading
            label: 模块标题｜H2
            type: string
          - name: intro
            label: 模块简介｜P
            type: text
          - name: items
            label: 图文功能屏
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{heading}"
            fields:
              - name: eyebrow
                label: 小标题｜SPAN
                type: string
                required: true
              - name: heading
                label: 功能标题｜H3
                type: string
                required: true
              - name: description
                label: 功能说明｜P
                type: text
                required: true
                description: 普通段落内容；如旧文案使用 • 或 · 分隔，系统会自动作为列表展示。
              - name: listItems
                label: 功能要点｜UL（可选）
                type: string
                list:
                  collapsible:
                    collapsed: true
                description: 每一项显示为无序列表条目；留空时会自动识别“功能说明”中的 • 或 ·。
              - name: image
                label: 功能图片｜IMG
                type: image
                required: true
                options:
                  media: images
              - name: imageAlt
                label: 图片替代文字｜IMG ALT
                type: string
                required: true
              - name: imagePosition
                label: 图片位置
                type: select
                required: true
                default: right
                options:
                  values:
                    - { name: right, label: 右侧 }
                    - { name: left, label: 左侧 }
      - name: faq
        label: 常见问题 / FAQ
        type: object
        list:
          min: 1
          collapsible:
            collapsed: true
            summary: "{question}"
        fields:
          - name: question
            label: FAQ 问题｜SUMMARY
            type: string
            required: true
            description: 可展开 FAQ 条目的问题文字；当前不是 H2/H3。
          - name: answer
            label: FAQ 回答｜P
            type: text
            required: true
            description: FAQ 展开后的普通回答段落。

