media:
  input: public/uploads
  output: /uploads

settings:
  content:
    merge: true
  commit:
    identity: app
    templates:
      create: "content(create): {path}"
      update: "content(update): {path}"
      delete: "content(delete): {path}"
      rename: "content(rename): {oldPath} -> {newPath}"

content:
  - name: blog
    label: 博客文章 / Blog posts
    type: collection
    path: src/content/blog
    format: yaml-frontmatter
    filename: "{fields.slug}.md"
    operations:
      create: true
      rename: false
      delete: false
    view:
      fields: [title, publishedAt, readTime]
      primary: title
      sort: [publishedAt, title]
      search: [title, description]
      default:
        sort: publishedAt
        order: desc
    fields:
      - name: slug
        label: URL 路径（发布后不要修改）
        type: string
        required: true
        pattern:
          regex: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
          message: 只能使用小写字母、数字和连字符，例如 image-format-guide。
      - name: title
        label: 标题 / Title
        type: string
        required: true
      - name: description
        label: SEO 描述（不超过 180 字符）
        type: text
        required: true
        options:
          maxlength: 180
      - name: publishedAt
        label: 发布日期 / Publish date
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: readTime
        label: 阅读时间 / Reading time
        type: string
        required: true
        default: 5 min read
      - name: body
        label: 正文 / Article body
        type: rich-text
        required: true

  - name: landing-pages
    label: 工具落地页 / Tool landing pages
    type: collection
    path: src/content/landing-pages
    format: json
    filename: "{fields.slug}.json"
    operations:
      create: true
      rename: false
      delete: false
    view:
      fields: [title, slug]
      primary: title
      sort: [title]
      search: [title, slug, description]
    fields:
      - name: slug
        label: URL 路径（发布后不要修改）
        type: string
        required: true
        pattern:
          regex: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
          message: 只能使用小写字母、数字和连字符，例如 remove-logo-from-image。
      - name: title
        label: SEO 标题
        type: string
        required: true
      - name: description
        label: SEO 描述（不超过 180 字符）
        type: text
        required: true
        options:
          maxlength: 180
      - name: eyebrow
        label: 小标题 / Eyebrow
        type: string
        required: true
      - name: heading
        label: 主标题 / Main heading
        type: string
        required: true
      - name: intro
        label: 简介 / Introduction
        type: text
        required: true
      - name: benefits
        label: 优点列表 / Benefits
        type: string
        list:
          min: 1
      - name: faq
        label: 常见问题 / FAQ
        type: object
        list:
          min: 1
          collapsible:
            collapsed: true
            summary: "{question}"
        fields:
          - name: question
            label: 问题 / Question
            type: string
            required: true
          - name: answer
            label: 回答 / Answer
            type: text
            required: true
