                description: 装饰性步骤编号，例如 01。
              - name: title
                label: 步骤标题｜H3
                type: string
                required: true
                description: 单个步骤卡片的 H3 标题。
              - name: description
                label: 步骤说明｜P
                type: text
                required: true
                description: 步骤标题下方的普通说明段落。
              - name: image
                label: 当前步骤独立配图｜IMG（可选）
                type: image
                description: 留空时按步骤顺序读取站点设置中的公共步骤配图。
                options:
                  media: images
              - name: imageAlt
                label: 独立配图替代文字｜IMG ALT（可选）
                type: string
                description: 仅在选择独立步骤配图时填写。
      - name: features
        label: 功能亮点 / Features（可选）
        type: object
        description: 显示在“使用步骤”和 FAQ 之间；至少添加一项图文功能屏后才会在页面展示。
        fields:
          - name: eyebrow
            label: 模块小标题｜SPAN
            type: string
          - name: heading
            label: 模块标题｜H2
            type: string
          - name: intro
            label: 模块简介｜P
            type: text
          - name: items
            label: 图文功能屏
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{heading}"
            fields:
              - name: enabled
                label: 显示此功能 / Visible
                type: boolean
                default: true
                description: 关闭后保留内容但不在当前工具页显示；可以随时重新开启。
              - name: eyebrow
                label: 小标题｜SPAN
                type: string
                required: true
              - name: heading
                label: 功能标题｜H3
                type: string
                required: true
              - name: description
                label: 功能说明｜P
                type: text
                required: true
                description: 普通段落内容；如旧文案使用 • 或 · 分隔，系统会自动作为列表展示。
              - name: listItems
                label: 功能要点｜UL（可选）
                type: string
                list:
                  collapsible:
                    collapsed: true
                description: 每一项显示为无序列表条目；留空时会自动识别“功能说明”中的 • 或 ·。
              - name: image
                label: 功能图片｜IMG
                type: image
                required: true
                options:
                  media: images
              - name: imageAlt
                label: 图片替代文字｜IMG ALT
                type: string
                required: true
              - name: imagePosition
                label: 图片位置
                type: select
                required: true
                default: right
                options:
                  values:
                    - { name: right, label: 右侧 }
                    - { name: left, label: 左侧 }
      - name: faq
        label: 常见问题 / FAQ
        type: object
        fields:
          - name: eyebrow
            label: FAQ 小标题｜SPAN
            type: string
            required: true
            description: 当前工具页 FAQ 区域 H2 上方的装饰性短文字。
          - name: heading
            label: FAQ 模块标题｜H2
            type: string
            required: true
            description: 当前工具页 FAQ 区域的 H2。
          - name: intro
            label: FAQ 简介｜P
            type: text
            required: true
            description: FAQ 标题下方的普通说明段落。
          - name: items
            label: FAQ 条目
            type: object
            list:
              min: 1
              collapsible:
                collapsed: true
                summary: "{question}"
            fields:
              - name: enabled
                label: 显示此条 FAQ / Visible
                type: boolean
                default: true
                description: 关闭后保留问答但不在当前工具页和 FAQ 结构化数据中显示。
              - name: question
                label: FAQ 问题｜SUMMARY
                type: string
                required: true
                description: 可展开 FAQ 条目的问题文字；当前不是 H2/H3。
              - name: answer
                label: FAQ 回答｜P
                type: text
                required: true
                description: FAQ 展开后的普通回答段落。
