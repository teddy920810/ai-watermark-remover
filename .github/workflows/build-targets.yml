name: Independent build artifacts
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: targets-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  targets:
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.plan.outputs.targets }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - id: plan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: echo "targets=$(node scripts/build-target.mjs ci-changes "$BASE_SHA" "$HEAD_SHA")" >> "$GITHUB_OUTPUT"
  build:
    needs: targets
    if: needs.targets.outputs.targets != '[]'
    strategy:
      matrix:
        target: ${{ fromJSON(needs.targets.outputs.targets) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Separate steps expose actual restore/save duration in job timing.
      - name: Restore optimized image cache
        id: image-cache
        if: matrix.target == 'site'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .vercel/cache/optimized-images
          key: images-v1-${{ runner.os }}-${{ runner.arch }}-node24-${{ hashFiles('package-lock.json', 'scripts/lib/optimized-images.mjs', 'scripts/optimize-images.mjs') }}-${{ github.sha }}
          restore-keys: images-v1-${{ runner.os }}-${{ runner.arch }}-node24-${{ hashFiles('package-lock.json', 'scripts/lib/optimized-images.mjs', 'scripts/optimize-images.mjs') }}-
      - name: Build and validate the selected Site, App or Worker artifact
        run: node scripts/build-target.mjs ${{ matrix.target }}
      - name: Save optimized image cache
        if: success() && matrix.target == 'site' && steps.image-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .vercel/cache/optimized-images
          key: ${{ steps.image-cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}-${{ github.sha }}
          path: dist-target/${{ matrix.target }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3
          # Same-SHA job reruns still rebuild and validate before replacing the artifact.
          # https://github.com/actions/upload-artifact/tree/v4#overwriting-an-artifact
          overwrite: true
  required:
    name: Required target artifacts
    if: always()
    needs: [targets, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Require every selected target to build successfully
        run: node scripts/build-target.mjs required
        env:
          SELECTED_TARGETS: ${{ needs.targets.outputs.targets }}
          TARGET_PLAN_RESULT: ${{ needs.targets.result }}
          TARGET_BUILD_RESULT: ${{ needs.build.result }}
# Vercel Git projects deploy independently using their target-specific ignoreCommand.
# Worker selection bundles the real server entry and validates its seven-file upload context; it never deploys.
# Required CI / verify remains unchanged. This workflow never receives deployment secrets.
