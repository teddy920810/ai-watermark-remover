name: Production smoke

on:
  workflow_dispatch:
    inputs:
      functional_operation:
        description: 'Optional credit-consuming functional smoke operation'
        required: false
        type: choice
        options:
          - public-only
          - background-removal
        default: public-only
  schedule:
    - cron: '17 2 * * *'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run public production smoke
        run: npm run test:smoke:production
        env:
          SMOKE_BASE_URL: https://watermarkgemini.com
      - name: Run background-removal functional smoke
        if: github.event_name == 'workflow_dispatch' && inputs.functional_operation == 'background-removal'
        run: npm run test:smoke:background-removal
        env:
          SMOKE_BASE_URL: https://watermarkgemini.com
          SMOKE_SESSION_COOKIE: ${{ secrets.PRODUCTION_SMOKE_SESSION_COOKIE }}
