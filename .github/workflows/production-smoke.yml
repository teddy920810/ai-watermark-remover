name: Production smoke

on:
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * *'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run public production smoke
        run: node scripts/production-smoke.mjs
        env:
          SMOKE_BASE_URL: https://www.watermarkgemini.com
