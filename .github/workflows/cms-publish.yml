name: Publish CMS changes

on:
  workflow_dispatch:
    inputs:
      payload:
        description: Pages CMS action payload
        required: true
        type: string
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: cms-branch-sync
  cancel-in-progress: false

jobs:
  publish:
    name: Publish cms-drafts to main
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/cms-drafts'
    runs-on: ubuntu-latest
    steps:
      - name: Sync main into cms-drafts, then publish
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const drafts = 'cms-drafts';
            const production = 'main';

            try {
              await github.rest.repos.merge({
                owner,
                repo,
                base: drafts,
                head: production,
                commit_title: 'chore(cms): sync main into drafts before publish',
              });
            } catch (error) {
              core.setFailed('Publishing stopped: cms-drafts conflicts with main. No production changes were made; a developer must resolve the conflict.');
              return;
            }

            try {
              await github.rest.repos.merge({
                owner,
                repo,
                base: production,
                head: drafts,
                commit_title: 'content(publish): publish CMS changes',
              });
            } catch (error) {
              core.setFailed('Publishing stopped: GitHub could not merge cms-drafts into main. No production deployment was started.');
              return;
            }

            const { data: mainRef } = await github.rest.git.getRef({
              owner,
              repo,
              ref: 'heads/main',
            });

            await github.rest.git.updateRef({
              owner,
              repo,
              ref: 'heads/cms-drafts',
              sha: mainRef.object.sha,
              force: false,
            });

            core.notice('CMS changes published. cms-drafts now matches main.');

  sync-main-to-drafts:
    name: Sync main into cms-drafts
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Keep the CMS branch current
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.repos.merge({
                owner: context.repo.owner,
                repo: context.repo.repo,
                base: 'cms-drafts',
                head: 'main',
                commit_title: 'chore(cms): sync main into drafts',
              });
              core.notice('cms-drafts is synchronized with main.');
            } catch (error) {
              core.setFailed('cms-drafts could not be synchronized with main because of a conflict. The draft content and production site were left unchanged; a developer must resolve it.');
            }
